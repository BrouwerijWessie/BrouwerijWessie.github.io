name: Build and deploy website

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1
        with:
          bundler-cache: true
      - name: Install image converter
        timeout-minutes: 3
        run: |
          sudo apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=30
          sudo apt-get install --yes --no-install-recommends -o Acquire::Retries=2 -o Acquire::http::Timeout=30 imagemagick
      - name: Audit Ruby dependencies
        run: bundle exec bundler-audit check --update
      - name: Build website
        env:
          JEKYLL_ENV: production
        run: bash bin/cibuild
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website
          if-no-files-found: error
          path: _site/
          include-hidden-files: true
          retention-days: 7

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
    steps:
      - name: Check out publishing branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: _publish
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: website
          path: _site
      - name: Commit generated website
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          rsync -a --delete --exclude='.git/' --exclude='CNAME' _site/ _publish/
          git -C _publish config user.name 'github-actions[bot]'
          git -C _publish config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C _publish add --all
          if ! git -C _publish diff --cached --quiet; then
            git -C _publish commit -m "Build website from ${SOURCE_SHA}"
            git -C _publish push origin HEAD:gh-pages
          fi
      - name: Request and check Pages publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deployed_sha=$(git -C _publish rev-parse HEAD)
          result=$(gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest")
          if jq -e --arg sha "$deployed_sha" '.commit == $sha and .status == "built"' <<< "$result" >/dev/null; then
            echo 'This website commit is already published.'
            exit 0
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
          # The image-heavy site can take over six minutes for Pages to publish.
          for attempt in $(seq 1 180); do
            result=$(gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest")
            jq -r '"Pages status: \(.status), commit: \(.commit)"' <<< "$result"
            if jq -e --arg sha "$deployed_sha" '.commit == $sha and .status == "built"' <<< "$result" >/dev/null; then
              echo 'GitHub Pages published successfully.'
              exit 0
            fi
            if jq -e --arg sha "$deployed_sha" '.commit == $sha and .status == "errored"' <<< "$result" >/dev/null; then
              jq '.error' <<< "$result"
              exit 1
            fi
            sleep 5
          done
          echo 'Timed out waiting for GitHub Pages publication.' >&2
          jq '{commit, status, error}' <<< "$result" >&2
          exit 1
