version: 2
updates:
  - package-ecosystem: bundler
    directory: /
    target-branch: master
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      ruby-dependencies:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    target-branch: master
    schedule:
      interval: weekly
    groups:
      workflow-actions:
        patterns: ['*']
